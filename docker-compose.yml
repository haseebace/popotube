# Jackett and backend. No Next.js — run the frontend on the host: `npm run dev` (port 3000).
# Use `.env` with localhost URLs for Next on the host (Jackett 9117, backend 3001). The backend service overrides JACKETT_URL for in-network Docker.

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: popotube-jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./docker/jackett/config:/config
    ports:
      - "9117:9117"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: popotube-backend
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    environment:
      JACKETT_URL: http://jackett:9117
    depends_on:
      - jackett
    restart: unless-stopped
