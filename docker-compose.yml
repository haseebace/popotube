version: '3.8'

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: popotube-jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./docker/jackett/config:/config
    ports:
      - "9117:9117"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: popotube-backend
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:3001
    container_name: popotube-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:3001
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      - backend
