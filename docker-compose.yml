version: '3.8'

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: popotube-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ./docker/qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080" # Web UI
      - "6881:6881" # Torrent port TCP
      - "6881:6881/udp" # Torrent port UDP
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: popotube-jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./docker/jackett/config:/config
      - ./downloads:/downloads
    ports:
      - "9117:9117"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: popotube-nginx
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - qbittorrent
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: popotube-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./downloads:/downloads
    restart: unless-stopped
    depends_on:
      - qbittorrent

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:3001
    container_name: popotube-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:3001
    env_file:
      - .env.local
    restart: unless-stopped
    depends_on:
      - backend

