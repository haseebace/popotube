# Local development stack.
# Runs Jackett + backend only. Frontend runs on host via `npm run dev`.

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: popotube-jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./docker/jackett/config:/config
    ports:
      - "9117:9117"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: popotube-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      JACKETT_URL: http://jackett:9117
    depends_on:
      - jackett
    restart: unless-stopped
